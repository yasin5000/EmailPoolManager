<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Email Pool</title>
<style>
:root{--bg:#0b0f1a;--card:#121826;--card2:#171f31;--line:#ffffff14;--tx:#eef1f8;--mut:#8b94a8;--ok:#22c55e;--warn:#f59e0b;--a:#6366f1;--b:#8b5cf6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.35 -apple-system,Roboto,"Segoe UI",sans-serif}
body{padding:14px 14px 40px;max-width:560px;margin:auto}
header{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 12px}
h1{font-size:18px;margin:0;letter-spacing:.2px}
.sub{color:var(--mut);font-size:12px}
.pill{font-size:11px;padding:4px 9px;border-radius:99px;background:#ffffff10;color:var(--mut)}
.pill.on{background:#22c55e22;color:var(--ok)}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.hero{display:flex;align-items:center;gap:14px}
.num{font-size:44px;font-weight:800;line-height:1;background:linear-gradient(90deg,#a5b4fc,#c4b5fd);-webkit-background-clip:text;color:transparent}
.hero small{display:block;color:var(--mut);margin-top:4px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);margin:0 0 10px;font-weight:600}
button{font:inherit;border:0;color:#fff;border-radius:12px;padding:10px 14px;font-weight:600}
button:active{transform:scale(.97);opacity:.9}
.primary{background:linear-gradient(90deg,var(--a),var(--b));width:100%}
.stop{background:linear-gradient(90deg,#ef4444,#f97316);width:100%}
.ghost{background:#ffffff12;color:var(--tx)}
.small{padding:6px 11px;font-size:12px;border-radius:9px}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-of-type{border-bottom:0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--warn);flex:none}
.dot.ok{background:var(--ok)}
.row .t{flex:1}.row .t b{display:block;font-weight:600}.row .t span{color:var(--mut);font-size:12px}
textarea{width:100%;min-height:96px;resize:vertical;background:#0b1020;color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:10px;font:13px ui-monospace,monospace;outline:none}
textarea:focus{border-color:var(--a)}
.actions{display:flex;gap:8px;margin-top:8px}.actions .primary{flex:1}
#msg{min-height:18px;margin-top:8px;font-size:12px;color:var(--mut)}
ul{list-style:none;margin:0;padding:0;max-height:46vh;overflow:auto}
li{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;font:13px ui-monospace,monospace}
li:nth-child(odd){background:#ffffff06}
li .i{color:var(--mut);width:28px;font-size:11px}
li .e{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li.next{background:#6366f122;outline:1px solid #6366f155}
li button{background:none;color:var(--mut);padding:2px 8px;font-size:16px}
.empty{color:var(--mut);text-align:center;padding:18px 0}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.hd h2{margin:0}
</style></head><body>
<header>
  <div><h1>Email Pool</h1><div class="sub">Queue • copy • paste</div></div>
  <span id="state" class="pill">Tool off</span>
</header>

<div class="card hero">
  <div><div class="num" id="count">0</div><small>emails remaining</small></div>
</div>

<div class="card">
  <h2>Floating tool</h2>
  <div class="row"><i class="dot" id="d-overlay"></i><div class="t"><b>Display over other apps</b><span>Shows the tool above every app</span></div><button class="ghost small" id="b-overlay">Allow</button></div>
  <div class="row"><i class="dot" id="d-a11y"></i><div class="t"><b>Accessibility (for PASTE)</b><span>Lets PASTE fill the focused field</span></div><button class="ghost small" id="b-a11y">Enable</button></div>
  <div class="row"><i class="dot" id="d-notif"></i><div class="t"><b>Notifications</b><span>Keeps the service visible &amp; alive</span></div><button class="ghost small" id="b-notif">Allow</button></div>
  <div style="margin-top:12px"><button id="toggle" class="primary">Start floating tool</button></div>
</div>

<div class="card">
  <h2>Add emails</h2>
  <textarea id="bulk" placeholder="Paste emails — separated by new lines, commas, spaces or semicolons" spellcheck="false" autocapitalize="off"></textarea>
  <div class="actions"><button class="primary" id="add">Add to queue</button><button class="ghost" id="paste-in">Clear box</button></div>
  <div id="msg"></div>
</div>

<div class="card">
  <div class="hd"><h2>Queue (next 100)</h2><button class="ghost small" id="clear">Clear all</button></div>
  <ul id="list"></ul>
</div>

<script>
const N = window.Native || {  // browser preview mock
  _q:[], add(t){const m=t.split(/[\s,;]+/).filter(x=>/@/.test(x));this._q.push(...m);return JSON.stringify({added:m.length,duplicates:0,invalid:0})},
  list(){return JSON.stringify(this._q.slice(0,100))},remove(e){this._q=this._q.filter(x=>x!==e)},clear(){this._q=[]},
  status(){return JSON.stringify({count:this._q.length,overlay:false,a11y:false,notif:true,running:false})},
  requestOverlay(){},openAccessibility(){},requestNotifications(){},startOverlay(){},stopOverlay(){}};
const $=id=>document.getElementById(id);
let st={}, armed=false;

function render(){
  st = JSON.parse(N.status());
  $('count').textContent = st.count.toLocaleString();
  for (const [k,id] of [['overlay','overlay'],['a11y','a11y'],['notif','notif']]){
    $('d-'+id).classList.toggle('ok', !!st[k]);
    $('b-'+id).style.display = st[k] ? 'none' : '';
  }
  $('state').textContent = st.running ? 'Tool on' : 'Tool off';
  $('state').classList.toggle('on', !!st.running);
  const t=$('toggle'); t.textContent = st.running ? 'Stop floating tool' : 'Start floating tool';
  t.className = st.running ? 'stop' : 'primary';
  const list = JSON.parse(N.list(100)), ul=$('list'); ul.textContent='';
  if(!list.length){const d=document.createElement('div');d.className='empty';d.textContent='Queue is empty';ul.appendChild(d);return}
  list.forEach((e,i)=>{
    const li=document.createElement('li'); if(!i) li.className='next';
    const a=document.createElement('span');a.className='i';a.textContent=i?i+1:'▶';
    const b=document.createElement('span');b.className='e';b.textContent=e;
    const x=document.createElement('button');x.textContent='×';x.setAttribute('aria-label','Remove');
    x.onclick=()=>{N.remove(e);render()};
    li.append(a,b,x);ul.appendChild(li);
  });
}
window.onNative = render;

$('add').onclick=()=>{
  const v=$('bulk').value.trim(); if(!v){$('msg').textContent='Paste some emails first.';return}
  const r=JSON.parse(N.add(v));
  $('msg').textContent=`Added ${r.added} • ${r.duplicates} duplicate${r.duplicates==1?'':'s'} skipped • ${r.invalid} invalid`;
  $('bulk').value=''; render();
};
$('paste-in').onclick=()=>{$('bulk').value='';$('msg').textContent=''};
$('b-overlay').onclick=()=>N.requestOverlay();
$('b-a11y').onclick=()=>N.openAccessibility();
$('b-notif').onclick=()=>N.requestNotifications();
$('toggle').onclick=()=>{ st.running ? N.stopOverlay() : N.startOverlay(); setTimeout(render,500) };
$('clear').onclick=function(){
  if(!armed){armed=true;this.textContent='Tap again to confirm';setTimeout(()=>{armed=false;this.textContent='Clear all'},3000);return}
  armed=false;this.textContent='Clear all';N.clear();render();
};
render();
</script></body></html>
