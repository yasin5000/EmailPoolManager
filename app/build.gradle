plugins { id 'com.android.application' }

android {
    namespace 'com.emailpool.manager'
    compileSdk 34
    defaultConfig {
        applicationId 'com.emailpool.manager'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    // One fixed signing key for every build. Without it GitHub creates a new random key each run,
    // Android then treats each build as a different app and hands out a new device id every time,
    // which would break the one-key-one-phone lock. It also lets new builds install over old ones.
    signingConfigs {
        shared {
            storeFile file('shared.keystore')
            storePassword 'emailpool'
            keyAlias 'emailpool'
            keyPassword 'emailpool'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// No third-party dependencies: pure Android framework APIs.
