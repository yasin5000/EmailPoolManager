plugins { id 'com.android.application' }

android {
    namespace 'com.emailpool.manager'
    compileSdk 34
    defaultConfig {
        applicationId 'com.emailpool.manager'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the release APK installs out of the box.
            // Replace with your own keystore for distribution.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// No third-party dependencies: pure Android framework APIs.
